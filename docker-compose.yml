version: "3.8"

services:
  social-connect-api:
    build: .
    container_name: social-connect-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=8h
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    volumes:
      - social_connect_data:/app/db/data

volumes:
  social_connect_data:
